name: Deploy Frontend to DigitalOcean

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-frontend.yml"

concurrency:
  group: deploy-frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required repository variables
        shell: bash
        run: |
          set -euo pipefail

          missing=0

          if [ -z "${{ vars.FRONTEND_APP_NAME }}" ]; then
            echo "::error::Missing GitHub repository variable: FRONTEND_APP_NAME"
            missing=1
          fi

          if [ -z "${{ vars.VITE_API_BASE_URL }}" ]; then
            echo "::error::Missing GitHub repository variable: VITE_API_BASE_URL"
            missing=1
          fi

          if [ "${missing}" -ne 0 ]; then
            echo "Go to Repository Settings → Secrets and variables → Actions → Variables → Repository variables"
            exit 1
          fi

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_APP_ENV: ${{ vars.VITE_APP_ENV || 'production' }}
        run: npm run build

      - name: Deploy to DigitalOcean App Platform
        uses: digitalocean/app_action@v2
        with:
          app_name: ${{ vars.FRONTEND_APP_NAME }}
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Notify Slack
        if: always()
        shell: bash
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail

          if [ -z "${SLACK_WEBHOOK_URL:-}" ]; then
            echo "SLACK_WEBHOOK_URL is not configured. Skipping Slack notification."
            exit 0
          fi

          if [ "${JOB_STATUS}" = "success" ]; then
            EMOJI="✅"
          else
            EMOJI="❌"
          fi

          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          cat > slack-payload.json <<EOF
          {
            "text": "${EMOJI} Finalcase frontend DigitalOcean deploy: ${JOB_STATUS}\nRepository: ${GITHUB_REPOSITORY}\nBranch: ${GITHUB_REF_NAME}\nRun: ${RUN_URL}"
          }
          EOF

          curl -X POST -H "Content-type: application/json" --data @slack-payload.json "${SLACK_WEBHOOK_URL}"
