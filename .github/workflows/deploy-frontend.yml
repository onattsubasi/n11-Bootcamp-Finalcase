name: Deploy Frontend to DigitalOcean

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-frontend.yml"

concurrency:
  group: deploy-frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_APP_ENV: production
        run: npm run build

      - name: Deploy to DigitalOcean App Platform
        uses: digitalocean/app_action@v2
        with:
          app_name: ${{ vars.FRONTEND_APP_NAME }}
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Notify Slack
        if: always()
        shell: bash
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          if [ -n "${SLACK_WEBHOOK_URL:-}" ]; then
            python - <<'PY' > slack-payload.json
          import json
          import os

          status = os.environ.get("JOB_STATUS", "unknown")
          repo = os.environ.get("GITHUB_REPOSITORY", "")
          ref = os.environ.get("GITHUB_REF_NAME", "")
          run_id = os.environ.get("GITHUB_RUN_ID", "")
          server = os.environ.get("GITHUB_SERVER_URL", "https://github.com")
          run_url = f"{server}/{repo}/actions/runs/{run_id}" if repo and run_id else ""

          ok = status == "success"
          emoji = "✅" if ok else "❌"
          color = "good" if ok else "danger"

          payload = {
              "text": f"{emoji} Finalcase frontend DigitalOcean deploy: {status}",
              "attachments": [
                  {
                      "fallback": f"Finalcase frontend deploy {status}",
                      "color": color,
                      "fields": [
                          {"title": "Repository", "value": repo, "short": True},
                          {"title": "Branch", "value": ref, "short": True},
                          {"title": "Run", "value": f"<{run_url}|Open GitHub Actions run>" if run_url else "-", "short": False},
                      ],
                  }
              ],
          }
          print(json.dumps(payload))
          PY
            curl -X POST -H 'Content-type: application/json' --data @slack-payload.json "${SLACK_WEBHOOK_URL}"
          fi
