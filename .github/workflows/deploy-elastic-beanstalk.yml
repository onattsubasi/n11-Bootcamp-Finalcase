name: Deploy Backend to AWS Elastic Beanstalk

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "deploy/aws/elasticbeanstalk/**"
      - ".github/workflows/deploy-elastic-beanstalk.yml"

concurrency:
  group: deploy-eb-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  EB_APPLICATION_NAME: ${{ vars.EB_APPLICATION_NAME }}
  EB_ENVIRONMENT_NAME: ${{ vars.EB_ENVIRONMENT_NAME }}
  EB_DEPLOY_BUCKET: ${{ vars.EB_DEPLOY_BUCKET }}
  ECR_REPOSITORY_PREFIX: ${{ vars.ECR_REPOSITORY_PREFIX }}
  IMAGE_TAG: ${{ github.sha }}

jobs:
  deploy:
    name: Build images and deploy backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required repository variables
        shell: bash
        run: |
          set -euo pipefail

          missing=0

          require_var() {
            local name="$1"
            local value="$2"

            if [ -z "${value}" ]; then
              echo "::error::Missing GitHub repository variable: ${name}"
              missing=1
            else
              echo "Found repository variable: ${name}"
            fi
          }

          require_var "AWS_REGION" "${AWS_REGION}"
          require_var "EB_APPLICATION_NAME" "${EB_APPLICATION_NAME}"
          require_var "EB_ENVIRONMENT_NAME" "${EB_ENVIRONMENT_NAME}"
          require_var "EB_DEPLOY_BUCKET" "${EB_DEPLOY_BUCKET}"
          require_var "ECR_REPOSITORY_PREFIX" "${ECR_REPOSITORY_PREFIX}"

          if [ "${missing}" -ne 0 ]; then
            echo
            echo "Go to:"
            echo "Repository Settings → Secrets and variables → Actions → Variables → Repository variables"
            echo
            echo "Required variables:"
            echo "AWS_REGION"
            echo "EB_APPLICATION_NAME"
            echo "EB_ENVIRONMENT_NAME"
            echo "EB_DEPLOY_BUCKET"
            echo "ECR_REPOSITORY_PREFIX"
            exit 1
          fi

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Ensure Elastic Beanstalk deployment bucket exists
        shell: bash
        run: |
          set -euo pipefail

          if aws s3api head-bucket --bucket "${EB_DEPLOY_BUCKET}" 2>/dev/null; then
            echo "Bucket exists: ${EB_DEPLOY_BUCKET}"
          else
            echo "Creating bucket: ${EB_DEPLOY_BUCKET}"

            if [ "${AWS_REGION}" = "us-east-1" ]; then
              aws s3api create-bucket                 --bucket "${EB_DEPLOY_BUCKET}"                 --region "${AWS_REGION}"
            else
              aws s3api create-bucket                 --bucket "${EB_DEPLOY_BUCKET}"                 --region "${AWS_REGION}"                 --create-bucket-configuration LocationConstraint="${AWS_REGION}"
            fi
          fi

      - name: Install backend modules
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail

          # Important:
          # First install common library modules into the local Maven repository.
          # Then Jib is executed only for application service modules.
          # Do not use "-am" together with "jib:build", otherwise Jib tries to
          # containerize common-core/common-events/common-security and fails because
          # those modules do not have a main class.
          mvn -B -ntp -DskipTests clean install

      - name: Build and push service images with Jib
        working-directory: backend
        shell: bash
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          set -euo pipefail

          services=(
            discovery-service
            api-gateway
            auth-service
            user-service
            catalog-service
            search-service
            basket-service
            inventory-service
            promotion-service
            order-service
            payment-service
            shipment-service
            checkout-service
            notification-service
            review-service
          )

          for service in "${services[@]}"; do
            repo="${ECR_REPOSITORY_PREFIX}-${service}"
            image="${ECR_REGISTRY}/${repo}:${IMAGE_TAG}"

            echo "Ensuring ECR repository exists: ${repo}"
            aws ecr describe-repositories --repository-names "${repo}" >/dev/null 2>&1 ||               aws ecr create-repository --repository-name "${repo}" >/dev/null

            echo "Building module services/${service} -> ${image}"

            mvn -B -ntp -pl "services/${service}" -DskipTests package               com.google.cloud.tools:jib-maven-plugin:3.4.5:build               -Dimage="${image}"
          done

      - name: Render Elastic Beanstalk docker-compose.yml
        shell: bash
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          set -euo pipefail

          rm -rf eb-package
          mkdir -p eb-package

          sed             -e "s#__ECR_REGISTRY__#${ECR_REGISTRY}#g"             -e "s#__ECR_REPOSITORY_PREFIX__#${ECR_REPOSITORY_PREFIX}#g"             -e "s#__IMAGE_TAG__#${IMAGE_TAG}#g"             deploy/aws/elasticbeanstalk/docker-compose.aws-eb.template.yml             > eb-package/docker-compose.yml

          cd eb-package
          zip -r "../finalcase-eb-${IMAGE_TAG}.zip" docker-compose.yml

      - name: Upload deployment bundle to S3
        shell: bash
        run: |
          set -euo pipefail
          aws s3 cp "finalcase-eb-${IMAGE_TAG}.zip" "s3://${EB_DEPLOY_BUCKET}/finalcase-eb-${IMAGE_TAG}.zip"

      - name: Create Elastic Beanstalk application version
        shell: bash
        run: |
          set -euo pipefail

          aws elasticbeanstalk create-application-version             --application-name "${EB_APPLICATION_NAME}"             --version-label "${IMAGE_TAG}"             --source-bundle S3Bucket="${EB_DEPLOY_BUCKET}",S3Key="finalcase-eb-${IMAGE_TAG}.zip"

      - name: Deploy Elastic Beanstalk application version
        shell: bash
        run: |
          set -euo pipefail

          aws elasticbeanstalk update-environment             --application-name "${EB_APPLICATION_NAME}"             --environment-name "${EB_ENVIRONMENT_NAME}"             --version-label "${IMAGE_TAG}"

      - name: Wait for Elastic Beanstalk environment update
        shell: bash
        run: |
          set -euo pipefail

          aws elasticbeanstalk wait environment-updated             --application-name "${EB_APPLICATION_NAME}"             --environment-names "${EB_ENVIRONMENT_NAME}"

      - name: Notify Slack
        if: always()
        shell: bash
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail

          if [ -z "${SLACK_WEBHOOK_URL:-}" ]; then
            echo "SLACK_WEBHOOK_URL is not configured. Skipping Slack notification."
            exit 0
          fi

          if [ "${JOB_STATUS}" = "success" ]; then
            EMOJI="✅"
          else
            EMOJI="❌"
          fi

          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          cat > slack-payload.json <<EOF
          {
            "text": "${EMOJI} Finalcase backend Elastic Beanstalk deploy: ${JOB_STATUS}\nRepository: ${GITHUB_REPOSITORY}\nBranch: ${GITHUB_REF_NAME}\nCommit: ${IMAGE_TAG}\nRun: ${RUN_URL}"
          }
          EOF

          curl -X POST -H "Content-type: application/json" --data @slack-payload.json "${SLACK_WEBHOOK_URL}"
