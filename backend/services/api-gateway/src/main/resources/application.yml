      review-service:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
  timelimiter:
    instances:
      auth-service:
        timeoutDuration: 10s
      user-service:
        timeoutDuration: 10s
      catalog-service:
        timeoutDuration: 10s
      search-service:
        timeoutDuration: 10s
      basket-service:
        timeoutDuration: 10s
      inventory-service:
        timeoutDuration: 10s
      promotion-service:
        timeoutDuration: 10s
      order-service:
        timeoutDuration: 10s
      payment-service:
        timeoutDuration: 10s
      shipment-service:
        timeoutDuration: 10s
      checkout-service:
        timeoutDuration: 10s
      notification-service:
        timeoutDuration: 10s
      review-service:
        timeoutDuration: 10s
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
