server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework
spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          httpclient:
            connect-timeout: 3000
            response-timeout: 10s
          globalcors:
            cors-configurations:
              "[/**]":
                allowedOrigins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
                allowedMethods:
                  - GET
                  - POST
                  - PUT
                  - PATCH
                  - DELETE
                  - OPTIONS
                allowedHeaders:
                  - Authorization
                  - Content-Type
                  - Accept
                  - Origin
                  - X-Requested-With
                  - Idempotency-Key
                  - X-Correlation-Id
                exposedHeaders:
                  - X-Correlation-Id
                allowCredentials: true
          routes:
            - id: auth-service
              uri: lb://auth-service
              predicates:
                - Path=/api/auth,/api/auth/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: auth-service
                    fallbackUri: forward:/fallback/auth-service
            - id: search-service-public
              uri: lb://search-service
              predicates:
                - Path=/api/products,/api/products/**,/api/search,/api/search/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: search-service
                    fallbackUri: forward:/fallback/search-service
            - id: review-service-public
              uri: lb://review-service
              predicates:
                - Path=/api/public/reviews,/api/public/reviews/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: review-service
                    fallbackUri: forward:/fallback/review-service
            - id: payment-service-callback
              uri: lb://payment-service
              predicates:
                - Path=/api/payments/iyzico/callback,/api/payments/iyzico/callback/**,/api/payments/providers/iyzico/checkout-form/callback,/api/payments/providers/iyzico/checkout-form/callback/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: payment-service
                    fallbackUri: forward:/fallback/payment-service
            - id: user-service
              uri: lb://user-service
              predicates:
                - Path=/api/customer/profile,/api/customer/profile/**,/api/customer/addresses,/api/customer/addresses/**,/api/customer/favorites,/api/customer/favorites/**,/api/customer/preferences,/api/customer/preferences/**,/api/customer/product-lists,/api/customer/product-lists/**,/api/admin/users,/api/admin/users/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: user-service
                    fallbackUri: forward:/fallback/user-service
            - id: basket-service
              uri: lb://basket-service
              predicates:
                - Path=/api/customer/basket,/api/customer/basket/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: basket-service
                    fallbackUri: forward:/fallback/basket-service
            - id: checkout-service
              uri: lb://checkout-service
              predicates:
                - Path=/api/customer/checkout,/api/customer/checkout/**,/api/admin/checkouts,/api/admin/checkouts/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: checkout-service
                    fallbackUri: forward:/fallback/checkout-service
            - id: catalog-service-admin
              uri: lb://catalog-service
              predicates:
                - Path=/api/admin/products,/api/admin/products/**,/api/admin/categories,/api/admin/categories/**,/api/admin/brands,/api/admin/brands/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: catalog-service
                    fallbackUri: forward:/fallback/catalog-service
            - id: inventory-service-admin
              uri: lb://inventory-service
              predicates:
                - Path=/api/admin/inventory,/api/admin/inventory/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: inventory-service
                    fallbackUri: forward:/fallback/inventory-service
            - id: promotion-service
              uri: lb://promotion-service
              predicates:
                - Path=/api/customer/coupons,/api/customer/coupons/**,/api/admin/promotions,/api/admin/promotions/**,/api/admin/coupons,/api/admin/coupons/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: promotion-service
                    fallbackUri: forward:/fallback/promotion-service
            - id: order-service
              uri: lb://order-service
              predicates:
                - Path=/api/customer/orders,/api/customer/orders/**,/api/admin/orders,/api/admin/orders/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: order-service
                    fallbackUri: forward:/fallback/order-service
            - id: payment-service
              uri: lb://payment-service
              predicates:
                - Path=/api/customer/payments,/api/customer/payments/**,/api/admin/payments,/api/admin/payments/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: payment-service
                    fallbackUri: forward:/fallback/payment-service
            - id: shipment-service
              uri: lb://shipment-service
              predicates:
                - Path=/api/customer/shipments,/api/customer/shipments/**,/api/admin/shipments,/api/admin/shipments/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: shipment-service
                    fallbackUri: forward:/fallback/shipment-service
            - id: notification-service
              uri: lb://notification-service
              predicates:
                - Path=/api/customer/notifications,/api/customer/notifications/**,/api/admin/notifications,/api/admin/notifications/**,/api/admin/notification-templates,/api/admin/notification-templates/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: notification-service
                    fallbackUri: forward:/fallback/notification-service
            - id: review-service
              uri: lb://review-service
              predicates:
                - Path=/api/customer/reviews,/api/customer/reviews/**,/api/admin/reviews,/api/admin/reviews/**,/api/admin/review-reports,/api/admin/review-reports/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: review-service
                    fallbackUri: forward:/fallback/review-service
            - id: search-service-admin
              uri: lb://search-service
              predicates:
                - Path=/api/admin/search,/api/admin/search/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: search-service
                    fallbackUri: forward:/fallback/search-service
            - id: search-products
              uri: lb://search-service
              predicates:
                - Path=/api/products,/api/products/**,/api/search,/api/search/**
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:${EUREKA_URI:http://localhost:8761/eureka/}}
    register-with-eureka: true
    fetch-registry: true
  instance:
    hostname: ${EUREKA_INSTANCE_HOSTNAME:localhost}
    prefer-ip-address: ${EUREKA_PREFER_IP_ADDRESS:false}
    instance-id: ${spring.application.name}:${server.port}
resilience4j:
  circuitbreaker:
    instances:
      auth-service:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
      user-service:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
      catalog-service:
