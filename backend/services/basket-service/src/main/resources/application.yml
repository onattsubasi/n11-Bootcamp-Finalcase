server:
  port: ${SERVER_PORT:8085}
  forward-headers-strategy: framework

spring:
  application:
    name: basket-service

  datasource:
    url: ${AUTH_DB_URL:jdbc:postgresql://${DB_HOST:127.0.0.1}:${DB_PORT:5432}/${AUTH_DB_NAME:basket_db}}
    username: ${AUTH_DB_USERNAME:${DB_USERNAME:postgres}}
    password: ${AUTH_DB_PASSWORD:${DB_PASSWORD:postgres}}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_MAX_POOL_SIZE:3}
      minimum-idle: ${DB_MIN_IDLE:1}
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:30000}
      idle-timeout: ${DB_IDLE_TIMEOUT_MS:600000}
      max-lifetime: ${DB_MAX_LIFETIME_MS:1800000}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: ${JPA_SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    baseline-on-migrate: false
    locations: classpath:db/migration

  
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}

  jackson:
    serialization:
      write-dates-as-timestamps: false

  cloud:
    openfeign:
      circuitbreaker:
        enabled: false

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

basket:
  cleanup:
    enabled: ${BASKET_CLEANUP_ENABLED:false}
    abandon-after-hours: ${BASKET_CLEANUP_ABANDON_AFTER_HOURS:720}
    batch-size: ${BASKET_CLEANUP_BATCH_SIZE:100}
    fixed-delay-ms: ${BASKET_CLEANUP_FIXED_DELAY_MS:3600000}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  level:
    root: INFO
    com.onatsubasi.finalcase.basket: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
