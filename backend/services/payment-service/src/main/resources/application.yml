server:
  port: ${SERVER_PORT:8089}
  forward-headers-strategy: framework

spring:
  application:
    name: payment-service

  datasource:
    url: ${AUTH_DB_URL:jdbc:postgresql://${DB_HOST:127.0.0.1}:${DB_PORT:5432}/${AUTH_DB_NAME:payment_db}}
    username: ${AUTH_DB_USERNAME:${DB_USERNAME:postgres}}
    password: ${AUTH_DB_PASSWORD:${DB_PASSWORD:postgres}}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_MAX_POOL_SIZE:3}
      minimum-idle: ${DB_MIN_IDLE:1}
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:30000}
      idle-timeout: ${DB_IDLE_TIMEOUT_MS:600000}
      max-lifetime: ${DB_MAX_LIFETIME_MS:1800000}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}

  config:
    import: optional:configserver:${CONFIG_URI:http://localhost:8762}

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:${EUREKA_URI:http://localhost:8761/eureka/}}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized

logging:
  level:
    root: INFO
    com.onatsubasi.finalcase.payment: DEBUG

payment:
  callback-url: ${PAYMENT_CALLBACK_URL:http://localhost:8089/api/payments/providers/iyzico/checkout-form/callback}
  default-success-url: ${PAYMENT_DEFAULT_SUCCESS_URL:http://localhost:3000/payment/success}
  default-failure-url: ${PAYMENT_DEFAULT_FAILURE_URL:http://localhost:3000/payment/failure}

  iyzico:
    api-key: ${IYZICO_API_KEY:}
    secret-key: ${IYZICO_SECRET_KEY:}
    base-url: ${IYZICO_BASE_URL:https://sandbox-api.iyzipay.com}
    locale: ${IYZICO_LOCALE:tr}
    default-identity-number: ${IYZICO_DEFAULT_IDENTITY_NUMBER:11111111111}
    default-country: ${IYZICO_DEFAULT_COUNTRY:Turkey}
