server:
  port: ${SERVER_PORT:8090}
  forward-headers-strategy: framework

spring:
  application:
    name: shipment-service

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  datasource:
    url: ${AUTH_DB_URL:jdbc:postgresql://${DB_HOST:127.0.0.1}:${DB_PORT:5432}/${AUTH_DB_NAME:shipment_db}}
    username: ${AUTH_DB_USERNAME:${DB_USERNAME:postgres}}
    password: ${AUTH_DB_PASSWORD:${DB_PASSWORD:postgres}}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_MAX_POOL_SIZE:3}
      minimum-idle: ${DB_MIN_IDLE:1}
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:30000}
      idle-timeout: ${DB_IDLE_TIMEOUT_MS:600000}
      max-lifetime: ${DB_MAX_LIFETIME_MS:1800000}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true

  rabbitmq:
    host: ${RABBITMQ_HOST:${RABBITMQ_HOST:localhost}}
    port: ${RABBITMQ_PORT:${RABBITMQ_PORT:5672}}
    username: ${RABBITMQ_USERNAME:${RABBITMQ_USERNAME:guest}}
    password: ${RABBITMQ_PASSWORD:${RABBITMQ_PASSWORD:guest}}

  cloud:
    openfeign:
      circuitbreaker:
        enabled: true
      client:
        config:
          default:
            connectTimeout: 3000
            readTimeout: 10000

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:${EUREKA_DEFAULT_ZONE:${EUREKA_URI:http://localhost:8761/eureka/}}}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: when_authorized

logging:
  level:
    root: INFO
    com.onatsubasi.finalcase.shipment: DEBUG

shipment:
  default-carrier: ${SHIPMENT_DEFAULT_CARRIER:MANUAL}
  auto-mark-ready-to-ship: ${SHIPMENT_AUTO_MARK_READY_TO_SHIP:true}

resilience4j:
  circuitbreaker:
    instances:
      order-service:
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 30s
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
  timelimiter:
    instances:
      order-service:
        timeoutDuration: 5s
