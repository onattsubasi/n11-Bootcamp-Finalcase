server:
  port: ${SERVER_PORT:8092}
  forward-headers-strategy: framework

spring:
  application:
    name: notification-service

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  datasource:
    url: ${AUTH_DB_URL:jdbc:postgresql://${DB_HOST:127.0.0.1}:${DB_PORT:5432}/${AUTH_DB_NAME:notification_db}}
    username: ${AUTH_DB_USERNAME:${DB_USERNAME:postgres}}
    password: ${AUTH_DB_PASSWORD:${DB_PASSWORD:postgres}}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_MAX_POOL_SIZE:3}
      minimum-idle: ${DB_MIN_IDLE:1}
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:30000}
      idle-timeout: ${DB_IDLE_TIMEOUT_MS:600000}
      max-lifetime: ${DB_MAX_LIFETIME_MS:1800000}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:${EUREKA_URI:http://localhost:8761/eureka/}}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: when_authorized
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  level:
    root: INFO
    com.onatsubasi.finalcase.notification: ${NOTIFICATION_LOG_LEVEL:INFO}

notification:
  default-locale: ${NOTIFICATION_DEFAULT_LOCALE:tr}
  max-delivery-attempts: ${NOTIFICATION_MAX_DELIVERY_ATTEMPTS:3}
  retry-batch-size: ${NOTIFICATION_RETRY_BATCH_SIZE:50}
  first-retry-delay-seconds: ${NOTIFICATION_FIRST_RETRY_DELAY_SECONDS:60}
  second-retry-delay-seconds: ${NOTIFICATION_SECOND_RETRY_DELAY_SECONDS:300}
  fallback-retry-delay-seconds: ${NOTIFICATION_FALLBACK_RETRY_DELAY_SECONDS:900}
  retry-scheduler-delay-ms: ${NOTIFICATION_RETRY_SCHEDULER_DELAY_MS:60000}
