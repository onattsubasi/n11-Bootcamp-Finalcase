groups:
  - name: finalcase-alerts
    rules:
      - alert: FinalcaseServiceDown
        expr: up{job="finalcase-services"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Finalcase service is down"
          description: "{{ $labels.instance }} is not responding to Prometheus scrape."

      - alert: FinalcaseHigh5xxRate
        expr: sum by (application) (rate(http_server_requests_seconds_count{status=~"5.."}[5m])) > 0.1
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High 5xx rate"
          description: "{{ $labels.application }} has elevated 5xx responses."
