global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: finalcase-services
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - "api-gateway:8080"
          - "discovery-service:8761"
          - "auth-service:8080"
          - "user-service:8080"
          - "catalog-service:8080"
          - "search-service:8080"
          - "basket-service:8080"
          - "inventory-service:8080"
          - "promotion-service:8080"
          - "checkout-service:8080"
          - "order-service:8080"
          - "payment-service:8080"
          - "shipment-service:8080"
          - "notification-service:8080"
          - "review-service:8080"
        labels:
          project: finalcase

  - job_name: rabbitmq
    metrics_path: /metrics
    static_configs:
      - targets:
          - "rabbitmq:15692"
        labels:
          project: finalcase
