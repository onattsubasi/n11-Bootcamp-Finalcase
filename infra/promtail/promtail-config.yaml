server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/finalcase-promtail-positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker-containers
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s

    relabel_configs:
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: container

      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        target_label: compose_service

      - source_labels: ['__meta_docker_container_label_com_docker_compose_project']
        target_label: compose_project

    pipeline_stages:
      - docker: {}

      # Spring services should emit structured JSON logs.
      # If a line is not JSON, this stage will not extract these fields, but the log line is still sent.
      - json:
          expressions:
            timestamp: timestamp
            level: level
            serviceName: serviceName
            correlationId: correlationId
            traceId: traceId
            userId: userId
            eventName: eventName
            errorCode: errorCode
            message: message

      - labels:
          level:
          serviceName:
          correlationId:
          traceId:
          eventName:
          errorCode:

      - timestamp:
          source: timestamp
          format: RFC3339Nano
          action_on_failure: skip
