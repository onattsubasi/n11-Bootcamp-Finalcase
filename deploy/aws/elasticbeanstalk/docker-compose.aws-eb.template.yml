  checkout-service:
    <<: *java-common
    image: __ECR_REGISTRY__/__ECR_REPOSITORY_PREFIX__-checkout-service:__IMAGE_TAG__
    container_name: finalcase-checkout-service
    environment:
      <<: *java-common.environment
      SPRING_DATASOURCE_URL: ${CHECKOUT_DB_URL}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}

  notification-service:
    <<: *java-common
    image: __ECR_REGISTRY__/__ECR_REPOSITORY_PREFIX__-notification-service:__IMAGE_TAG__
    container_name: finalcase-notification-service
    environment:
      <<: *java-common.environment
