      SPRING_DATASOURCE_URL: ${PROMOTION_DB_URL}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}

  order-service:
    <<: *java-common
    image: __ECR_REGISTRY__/__ECR_REPOSITORY_PREFIX__-order-service:__IMAGE_TAG__
    container_name: finalcase-order-service
    environment:
      <<: *java-common.environment
      SPRING_DATASOURCE_URL: ${ORDER_DB_URL}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}

  payment-service:
    <<: *java-common
    image: __ECR_REGISTRY__/__ECR_REPOSITORY_PREFIX__-payment-service:__IMAGE_TAG__
    container_name: finalcase-payment-service
    environment:
      <<: *java-common.environment
      SPRING_DATASOURCE_URL: ${PAYMENT_DB_URL}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      IYZICO_API_KEY: ${IYZICO_API_KEY}
      IYZICO_SECRET_KEY: ${IYZICO_SECRET_KEY}
      IYZICO_BASE_URL: ${IYZICO_BASE_URL:-https://sandbox-api.iyzipay.com}
      PAYMENT_PUBLIC_BASE_URL: ${PAYMENT_PUBLIC_BASE_URL}
      PAYMENT_SUCCESS_REDIRECT_URL: ${PAYMENT_SUCCESS_REDIRECT_URL}
      PAYMENT_FAILURE_REDIRECT_URL: ${PAYMENT_FAILURE_REDIRECT_URL}

  shipment-service:
    <<: *java-common
    image: __ECR_REGISTRY__/__ECR_REPOSITORY_PREFIX__-shipment-service:__IMAGE_TAG__
    container_name: finalcase-shipment-service
    environment:
      <<: *java-common.environment
