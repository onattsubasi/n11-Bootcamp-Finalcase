# Rendered by .github/workflows/deploy-elastic-beanstalk.yml
# PostgreSQL is expected to be AWS RDS, not a container.

x-aws-service-env: &aws-service-env
  SPRING_PROFILES_ACTIVE: prod
  SERVER_PORT: 8080
  EUREKA_URI: http://discovery-service:8761/eureka/
  SPRING_RABBITMQ_HOST: rabbitmq
  SPRING_RABBITMQ_PORT: 5672
  SPRING_RABBITMQ_USERNAME: ${RABBITMQ_DEFAULT_USER}
  SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_DEFAULT_PASS}
  MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,info,prometheus

services:
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    ports:
      - "5672:5672"
      - "15672:15672"

  discovery-service:
    image: __ECR_REGISTRY__/__ECR_REPOSITORY_PREFIX__-discovery-service:__IMAGE_TAG__
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8761
      EUREKA_CLIENT_REGISTER_WITH_EUREKA: "false"
      EUREKA_CLIENT_FETCH_REGISTRY: "false"

  api-gateway:
    image: __ECR_REGISTRY__/__ECR_REPOSITORY_PREFIX__-api-gateway:__IMAGE_TAG__
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8080
      EUREKA_URI: http://discovery-service:8761/eureka/
      JWT_SECRET: ${JWT_SECRET}
      JWT_ISSUER: ${JWT_ISSUER:-finalcase-auth-service}
    ports:
      - "80:8080"
    depends_on:
      - discovery-service


  auth-service:
    image: __ECR_REGISTRY__/__ECR_REPOSITORY_PREFIX__-auth-service:__IMAGE_TAG__
    restart: unless-stopped
    environment:
      <<: *aws-service-env
      SPRING_APPLICATION_NAME: auth-service
      SPRING_DATASOURCE_URL: jdbc:postgresql://${RDS_HOSTNAME}:${RDS_PORT:-5432}/auth_db
      SPRING_DATASOURCE_USERNAME: ${RDS_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${RDS_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ISSUER: ${JWT_ISSUER:-finalcase-auth-service}
      REFRESH_TOKEN_PEPPER: ${REFRESH_TOKEN_PEPPER}
      AUTH_REFRESH_COOKIE_SECURE: "true"
      AUTH_REFRESH_COOKIE_SAME_SITE: Strict
    depends_on:
      - rabbitmq
      - discovery-service

  user-service:
    image: __ECR_REGISTRY__/__ECR_REPOSITORY_PREFIX__-user-service:__IMAGE_TAG__
    restart: unless-stopped
    environment:
