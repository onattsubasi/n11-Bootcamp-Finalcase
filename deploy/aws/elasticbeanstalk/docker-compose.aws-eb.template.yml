name: finalcase-eb

x-java-common: &java-common
  restart: unless-stopped
  networks:
    - finalcase-net
  environment:
    SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
    EUREKA_DEFAULT_ZONE: ${EUREKA_DEFAULT_ZONE:-http://discovery-service:8761/eureka}
    EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: ${EUREKA_DEFAULT_ZONE:-http://discovery-service:8761/eureka}
    SPRING_RABBITMQ_HOST: ${RABBITMQ_HOST:-rabbitmq}
    SPRING_RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
    SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-finalcase}
    SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
    JWT_SECRET: ${JWT_SECRET}
    MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: ${MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE:-health,info,prometheus}
    MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS: ${MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS:-always}
    JAVA_TOOL_OPTIONS: "-Xms128m -Xmx384m -XX:+UseContainerSupport"
  depends_on:
    rabbitmq:
      condition: service_healthy
    discovery-service:
      condition: service_healthy

x-spring-healthcheck: &spring-healthcheck
  interval: 30s
  timeout: 8s
  retries: 10
  start_period: 90s

services:
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: finalcase-rabbitmq
    restart: unless-stopped
    networks:
      - finalcase-net
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-finalcase}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    volumes:
      - finalcase-rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 5s
      retries: 10

  discovery-service:
    image: __ECR_REGISTRY__/__ECR_REPOSITORY_PREFIX__-discovery-service:__IMAGE_TAG__
    container_name: finalcase-discovery-service
    restart: unless-stopped
    networks:
      - finalcase-net
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: ${MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE:-health,info,prometheus}
      MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS: ${MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS:-always}
      JAVA_TOOL_OPTIONS: "-Xms128m -Xmx256m -XX:+UseContainerSupport"
    healthcheck:
      <<: *spring-healthcheck
      test: ["CMD-SHELL", "wget -qO- http://localhost:8761/actuator/health | grep -q UP || exit 1"]

  api-gateway:
    <<: *java-common
    image: __ECR_REGISTRY__/__ECR_REPOSITORY_PREFIX__-api-gateway:__IMAGE_TAG__
    container_name: finalcase-api-gateway
    environment:
      <<: *java-common.environment
      FRONTEND_PUBLIC_URL: ${FRONTEND_PUBLIC_URL}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      BACKEND_PUBLIC_URL: ${BACKEND_PUBLIC_URL}
    ports:
      - "80:8080"
    healthcheck:
      <<: *spring-healthcheck
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP || exit 1"]

  auth-service:
    <<: *java-common
    image: __ECR_REGISTRY__/__ECR_REPOSITORY_PREFIX__-auth-service:__IMAGE_TAG__
    container_name: finalcase-auth-service
    environment:
      <<: *java-common.environment
      SPRING_DATASOURCE_URL: ${AUTH_DB_URL}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_ACCESS_TOKEN_TTL_MINUTES: ${JWT_ACCESS_TOKEN_TTL_MINUTES:-15}
      JWT_REFRESH_TOKEN_TTL_DAYS: ${JWT_REFRESH_TOKEN_TTL_DAYS:-14}

  user-service:
    <<: *java-common
    image: __ECR_REGISTRY__/__ECR_REPOSITORY_PREFIX__-user-service:__IMAGE_TAG__
    container_name: finalcase-user-service
    environment:
      <<: *java-common.environment
      SPRING_DATASOURCE_URL: ${USER_DB_URL}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}

  catalog-service:
    <<: *java-common
    image: __ECR_REGISTRY__/__ECR_REPOSITORY_PREFIX__-catalog-service:__IMAGE_TAG__
    container_name: finalcase-catalog-service
    environment:
      <<: *java-common.environment
      SPRING_DATASOURCE_URL: ${CATALOG_DB_URL}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}

  search-service:
    <<: *java-common
    image: __ECR_REGISTRY__/__ECR_REPOSITORY_PREFIX__-search-service:__IMAGE_TAG__
    container_name: finalcase-search-service
    environment:
      <<: *java-common.environment
      SPRING_DATASOURCE_URL: ${SEARCH_DB_URL}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}

  basket-service:
    <<: *java-common
    image: __ECR_REGISTRY__/__ECR_REPOSITORY_PREFIX__-basket-service:__IMAGE_TAG__
    container_name: finalcase-basket-service
    environment:
      <<: *java-common.environment
      SPRING_DATASOURCE_URL: ${BASKET_DB_URL}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}

  inventory-service:
    <<: *java-common
    image: __ECR_REGISTRY__/__ECR_REPOSITORY_PREFIX__-inventory-service:__IMAGE_TAG__
    container_name: finalcase-inventory-service
    environment:
      <<: *java-common.environment
      SPRING_DATASOURCE_URL: ${INVENTORY_DB_URL}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}

  promotion-service:
    <<: *java-common
    image: __ECR_REGISTRY__/__ECR_REPOSITORY_PREFIX__-promotion-service:__IMAGE_TAG__
    container_name: finalcase-promotion-service
    environment:
