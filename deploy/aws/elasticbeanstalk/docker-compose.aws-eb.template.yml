      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}

  review-service:
    <<: *java-common
    image: __ECR_REGISTRY__/__ECR_REPOSITORY_PREFIX__-review-service:__IMAGE_TAG__
    container_name: finalcase-review-service
    environment:
      <<: *java-common.environment
      SPRING_DATASOURCE_URL: ${REVIEW_DB_URL}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
